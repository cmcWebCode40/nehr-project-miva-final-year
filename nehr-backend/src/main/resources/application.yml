spring:
  application:
    name: nehr-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  jackson:
    default-property-inclusion: non_null

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always
    include-binding-errors: always

nehr:
  jwt:
    secret: ${JWT_SECRET:}
    access-token-ttl-minutes: ${JWT_ACCESS_TTL_MINUTES:30}
    refresh-token-ttl-days: ${JWT_REFRESH_TTL_DAYS:7}
  challenge:
    ttl-seconds: ${CHALLENGE_TTL_SECONDS:300}
  rate-limit:
    login-attempts-per-minute: ${LOGIN_RATE_LIMIT:10}
  did:
    method: nehr
    base-url: ${NEHR_BASE_URL:http://localhost:8080}
  platform-admin:
    email: ${PLATFORM_ADMIN_EMAIL:admin@nehr.local}
    default-password: ${PLATFORM_ADMIN_DEFAULT_PASSWORD:ChangeMe123!}
    name: ${PLATFORM_ADMIN_NAME:NEHR Platform Admin}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method
  api-docs:
    path: /v3/api-docs
