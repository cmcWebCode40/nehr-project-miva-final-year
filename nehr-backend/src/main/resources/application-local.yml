spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:nehr}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USERNAME:nehr}
    password: ${DB_PASSWORD:nehr_local_dev}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: ${SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

nehr:
  jwt:
    secret: ${JWT_SECRET:local-dev-only-secret-key-change-me-before-any-real-deployment-32b}

logging:
  level:
    ng.nehr.backend: DEBUG
